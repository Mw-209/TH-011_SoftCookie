services:
  db:
    image: postgres:16-alpine
    container_name: event_sys_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_registration_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_sys_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/event_registration_db?schema=public
      - SESSION_COOKIE_NAME=event_sys_session
      - SESSION_TTL_HOURS=24
      - CORS_ORIGIN=http://localhost:3000
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
